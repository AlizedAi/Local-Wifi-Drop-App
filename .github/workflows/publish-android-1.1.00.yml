name: Publish Android 1.1.00

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-android-1.1.00.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout versioned Android source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Build universal Android 1.1.00 APK
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'
          unzip -Z1 "$APK" | grep -q '^lib/armeabi-v7a/'
          unzip -Z1 "$APK" | grep -q '^lib/x86_64/'
          cp "$APK" Local-Wifi-Drop-1.1.00-Universal-Android.apk
          ls -lh Local-Wifi-Drop-1.1.00-Universal-Android.apk

      - name: Add Android 1.1.00 to the existing cross-platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.1.00 Local-Wifi-Drop-1.1.00-Universal-Android.apk \
            --repo "${GITHUB_REPOSITORY}" --clobber
          gh release view v1.1.00 --repo "${GITHUB_REPOSITORY}"
